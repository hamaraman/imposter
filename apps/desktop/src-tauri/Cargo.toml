[package]
name = "mycad"
version = "0.4.0"
edition = "2021"

[lib]
name = "mycad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
